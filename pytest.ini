[pytest]
# Run from the repo root: `pytest`
testpaths = tests
pythonpath = .
# --disable-socket (pytest-socket): any test that tries to open a network
# connection fails immediately. Tests must never hit TechPana,
# nepalfactcheck.org or Hugging Face.
# -ra: print a one-line reason for every skip / xfail at the end.
addopts = --disable-socket -ra --strict-markers
markers =
    data: reads the committed raw/ or data/ files (still offline)
    slow: long-running; excluded in CI with -m "not slow"
