  # Type:     Newspaper — Label 0 source
  # Active:   PARKED — code available, not in auto-pipeline
  # Reason:   Would cause Label 0 explosion (10-20 articles/day)
  # ---------------------------------------------------------------------------
  bbc_nepali:
    name: "bbc_nepali"
    display_name: "BBC Nepali"
    base_url: "https://www.bbc.com/nepali"
    list_url_template: "https://www.bbc.com/nepali/articles?page={page}"
    start_page: 1
    max_pages: null
    active: false              # PARKED — not in auto-pipeline
    rate_limit_seconds: 3
    retry_attempts: 3
    retry_backoff_seconds: 5
    language: "ne"
    scraper_class: "BBCNepaliScraper"
    source_type: "newspaper"
    cutoff_strategy: "url_date"

    labels:
      raw: []
      labels_produced: [0]
      label_basis: "source_credibility"
      note: >
        Label 0 by source credibility — not individual verification.
        Parked to prevent Label 0 class imbalance.
        Scraper code available for manual use.
        Document as limitation in paper.

