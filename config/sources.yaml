# config/sources.yaml
# =============================================================================
# NepFakeV2 scraper configuration.
# Single source of truth for all active scrapers.
#
# Rules:
#   - Never hardcode URLs or limits in scraper files
#   - To disable a source: set active: false
#   - To add a source: add a block here + write scraper class
#   - max_pages: null means paginate until empty page or cutoff date
#   - rate_limit_seconds must respect robots.txt Crawl-delay
# =============================================================================

sources:

  # ---------------------------------------------------------------------------
  # SOURCE 1: TechPana Factcheck
  # Type:     IFCN-certified professional fact-checker
  # Active:   YES — publishing 2026
  # Language: Nepali (Devanagari)
  # robots.txt: Crawl-delay: 10, Disallow: (empty = all allowed)
  # Note:     Protected by Cloudflare — scraped via FlareSolverr in CI
  # ---------------------------------------------------------------------------
  techpana:
    name: "techpana"
    display_name: "TechPana Factcheck"
    base_url: "https://techpana.com/factcheck/"
    list_url_template: "https://techpana.com/factcheck/?tab=nepali&page={page}"
    start_page: 1
    max_pages: null
    active: true
    rate_limit_seconds: 10
    retry_attempts: 2
    retry_backoff_seconds: 2
    language: "ne"
    scraper_class: "TechpanaScraper"
    source_type: "fact_checker"
    labels:
      raw: ["सही", "अपुष्ट", "भ्रामक", "मिथ्या"]
      labels_produced: [0, 1, 2]

  # ---------------------------------------------------------------------------
  # SOURCE 2: NepalFactCheck.org
  # Type:     Non-profit fact-checker (CMR-Nepal + MySansar.com)
  # Active:   YES — publishing 2026
  # Language: Nepali ONLY
  # robots.txt: No Crawl-delay, /news/ pages fully allowed
  # ---------------------------------------------------------------------------
  nepalfactcheck:
    name: "nepalfactcheck"
    display_name: "Nepal Factcheck"
    base_url: "https://nepalfactcheck.org/"
    list_url_template: "https://nepalfactcheck.org/news/page/{page}/"
    start_page: 1
    max_pages: null
    active: true
    rate_limit_seconds: 2
    retry_attempts: 3
    retry_backoff_seconds: 5
    language: "ne"
    scraper_class: "NepalfactcheckScraper"
    source_type: "fact_checker"
    labels:
      raw: ["सही सूचना", "अपुष्ट सूचना", "भ्रामक सूचना", "मिथ्या सूचना"]
      labels_produced: [0, 1, 2]