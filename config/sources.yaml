# config/sources.yaml
# =============================================================================
# Single source of truth for all scraper configuration.
#
# Rules:
#   - Never hardcode URLs, limits, or labels in scraper files
#   - To disable a source: set active: false
#   - To add a source: add a block here + write one scraper class
#   - max_pages: null means paginate until empty page or cutoff date
#   - Labels verified directly from each source's methodology page
#   - labels_produced shows current known labels but scraper catches
#     all verdicts automatically — if a source publishes a new
#     verdict type in future, label_mapper handles it
# =============================================================================

sources:

  # ---------------------------------------------------------------------------
  # SOURCE 1: TechPana Factcheck
  # Type:     IFCN-certified professional fact-checker
  # Founded:  22 Feb 2025
  # Active:   YES — publishing Aug 2026
  # Language: Nepali (Devanagari)
  # Labels:   Verified from techpana.com/factcheck/ methodology page
  # ---------------------------------------------------------------------------
  techpana:
    name: "techpana"
    display_name: "TechPana Factcheck"
    base_url: "https://techpana.com/factcheck/"
    list_url_template: "https://techpana.com/factcheck/?tab=nepali&page={page}"
    start_page: 1
    max_pages: null              # paginate until empty page or cutoff date
    active: true
    rate_limit_seconds: 2
    retry_attempts: 3
    retry_backoff_seconds: 5
    language: "ne"
    scraper_class: "TechpanaScraper"
    source_type: "fact_checker"

    # Verified labels from: techpana.com/factcheck/ methodology page
    # labels_produced reflects what is currently known to be published
    # scraper catches ALL verdicts regardless — label_mapper handles mapping
    labels:
      raw:
        - "सही"                  # True        → label 0 (if published)
        - "अपुष्ट"               # Unverified  → label 2
        - "भ्रामक"               # Misleading  → label 1
        - "मिथ्या"               # False       → label 1
      labels_produced: [0, 1, 2] # 0 caught automatically if published
      note: >
        'सही' (True) verdicts rarely published but caught automatically
        if they appear. 'भ्रामक' and 'मिथ्या' both map to label 1.
        Verdict appears as structured tag in article HTML.

  # ---------------------------------------------------------------------------
  # SOURCE 2: NepalCheck.org
  # Type:     Professional fact-checker
  # Founded:  August 2022
  # Founder:  Deepak Adhikari (ex-AFP, trained TechPana team)
  # Active:   YES — publishing Aug 2026
  # Language: Bilingual (Nepali + English)
  # Labels:   Verified from nepalcheck.org/about/
  # ---------------------------------------------------------------------------
  nepalcheck:
    name: "nepalcheck"
    display_name: "NepalCheck"
    base_url: "https://nepalcheck.org/factcheck/"
    list_url_template: "https://nepalcheck.org/factcheck/page/{page}/"
    start_page: 1
    max_pages: null              # paginate until empty page or cutoff date
    active: true
    rate_limit_seconds: 2
    retry_attempts: 3
    retry_backoff_seconds: 5
    language: "ne"
    scraper_class: "NepalcheckScraper"
    source_type: "fact_checker"

    # Verified labels from: nepalcheck.org/about/
    # IMPORTANT: verdict written in English prose inside article body
    # not as structured HTML tag — label_mapper uses text parsing
    labels:
      raw:
        - "misleading"           # → label 1
        - "false"                # → label 1
        - "half-truth"           # → label 1
        - "true"                 # → label 0 (if published)
        - "unverified"           # → label 2 (if published)
      labels_produced: [0, 1, 2] # all caught automatically if published
      note: >
        Verdict written in English prose, not a structured tag.
        Most common verdict is 'misleading'.
        All verdicts caught automatically by label_mapper.
        Extraction requires text parsing of article body.

  # ---------------------------------------------------------------------------
  # SOURCE 3: NepalFactCheck.org
  # Type:     Non-profit fact-checker (CMR-Nepal + MySansar.com)
  # Founded:  April 2020 (International Fact-Checking Day)
  # Active:   YES — publishing Aug 2026 (multiple per week)
  # Language: Nepali ONLY (by design)
  # Labels:   Verified from nepalfactcheck.org/faqs/
  # ---------------------------------------------------------------------------
  nepalfactcheck:
    name: "nepalfactcheck"
    display_name: "Nepal Factcheck"
    base_url: "https://nepalfactcheck.org/"
    list_url_template: "https://nepalfactcheck.org/page/{page}/"
    start_page: 1
    max_pages: null              # paginate until empty page or cutoff date
    active: true
    rate_limit_seconds: 2
    retry_attempts: 3
    retry_backoff_seconds: 5
    language: "ne"
    scraper_class: "NepalfactcheckScraper"
    source_type: "fact_checker"

    # Verified labels from: nepalfactcheck.org/faqs/
    # Same meaning as TechPana but appends 'सूचना' (information)
    # Explicitly publishes 'सही सूचना' when public confusion exists
    labels:
      raw:
        - "सही सूचना"            # True        → label 0
        - "अपुष्ट सूचना"         # Unverified  → label 2
        - "भ्रामक सूचना"         # Misleading  → label 1
        - "मिथ्या सूचना"         # False       → label 1
      labels_produced: [0, 1, 2]
      note: >
        Explicitly publishes 'सही सूचना' when factual claim
        has caused public confusion — confirmed in their FAQ.
        'भ्रामक सूचना' and 'मिथ्या सूचना' both map to label 1.
        All verdicts caught automatically if published.

  # ---------------------------------------------------------------------------
  # SOURCE 4: BBC Nepali
  # Type:     Established newspaper — Label 0 source
  # Active:   YES
  # Language: Nepali
  # Label:    0 only (REAL) — presumed factual by source credibility
  # Note:     International editorial standards applied to Nepal coverage
  # ---------------------------------------------------------------------------
  bbc_nepali:
    name: "bbc_nepali"
    display_name: "BBC Nepali"
    base_url: "https://www.bbc.com/nepali"
    list_url_template: "https://www.bbc.com/nepali/articles?page={page}"
    start_page: 1
    max_pages: null
    active: true
    rate_limit_seconds: 3        # be more polite with BBC
    retry_attempts: 3
    retry_backoff_seconds: 5
    language: "ne"
    scraper_class: "BBCNepaliScraper"
    source_type: "newspaper"

    labels:
      raw: []                    # no verdict labels — label assigned by source type
      labels_produced: [0]
      label_basis: "source_credibility"
      note: >
        Label 0 assigned by source credibility, not individual
        claim verification. Document as limitation in paper.
        Scrape news articles only — exclude opinion pieces.

  # ---------------------------------------------------------------------------
  # SOURCE 5: Kantipur
  # Type:     Established newspaper — Label 0 source
  # Active:   YES
  # Language: Nepali
  # Label:    0 only (REAL) — presumed factual by source credibility
  # Note:     Nepal's oldest and most established newspaper
  # ---------------------------------------------------------------------------
  kantipur:
    name: "kantipur"
    display_name: "Kantipur"
    base_url: "https://ekantipur.com"
    list_url_template: "https://ekantipur.com/news?page={page}"
    start_page: 1
    max_pages: null
    active: true
    rate_limit_seconds: 2
    retry_attempts: 3
    retry_backoff_seconds: 5
    language: "ne"
    scraper_class: "KantipurScraper"
    source_type: "newspaper"

    labels:
      raw: []                    # no verdict labels — label assigned by source type
      labels_produced: [0]
      label_basis: "source_credibility"
      note: >
        Label 0 assigned by source credibility, not individual
        claim verification. Document as limitation in paper.
        Scrape news articles only — exclude opinion pieces.

  # ---------------------------------------------------------------------------
  # SOURCE 6: MisinfoNepal — PERMANENTLY CLOSED
  # Reason:   Owner confirmed scraping not permitted (contacted 30 Aug 2026)
  # Decision: Removed from all planning
  # ---------------------------------------------------------------------------
  misinfonepal:
    name: "misinfonepal"
    display_name: "Misinformation Nepal"
    base_url: "https://misinfonepal.com/"
    list_url_template: null
    start_page: null
    max_pages: null
    active: false                # PERMANENTLY CLOSED — do not activate
    rate_limit_seconds: null
    retry_attempts: null
    retry_backoff_seconds: null
    language: "ne"
    scraper_class: null
    source_type: null
    labels:
      raw: []
      labels_produced: []
      note: >
        Owner confirmed scraping not permitted on 30 Aug 2026.
        Permanently closed. See pending/misinfonepal_notes.md.