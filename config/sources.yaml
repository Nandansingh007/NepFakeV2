# config/sources.yaml
# =============================================================================
# Single source of truth for all scraper configuration.
#
# Rules:
#   - Never hardcode URLs, limits, or labels in scraper files
#   - To disable a source: set active: false
#   - To add a source: add a block here + write one scraper class
#   - max_pages: null means paginate until empty page or cutoff date
#   - Labels verified directly from each source's methodology page
#   - cutoff_strategy defines how incremental scraping works per source
# =============================================================================

sources:

  # ---------------------------------------------------------------------------
  # SOURCE 1: TechPana Factcheck
  # Type:     IFCN-certified professional fact-checker
  # Founded:  22 Feb 2025
  # Active:   YES — publishing Aug 2026
  # Language: Nepali (Devanagari)
  # Labels:   Verified from techpana.com/factcheck/ methodology page
  # ---------------------------------------------------------------------------
  techpana:
    name: "techpana"
    display_name: "TechPana Factcheck"
    base_url: "https://techpana.com/factcheck/"
    list_url_template: "https://techpana.com/factcheck/?tab=nepali&page={page}"
    start_page: 1
    max_pages: null
    active: true
    rate_limit_seconds: 3
    retry_attempts: 2
    retry_backoff_seconds: 2
    language: "ne"
    scraper_class: "TechpanaScraper"
    source_type: "fact_checker"

    # Incremental cutoff strategy
    # TechPana URLs contain sequential article IDs — no date in URL
    # techpana.com/2026/158693/slug → ID 158693
    # Higher ID = newer article
    # Stop pagination when article ID <= last_scraped_article_id
    cutoff_strategy: "article_id"

    # Verified labels — stored as-is in raw, mapped in Stage 2
    labels:
      raw:
        - "सही"        # True        → label 0 (if published)
        - "अपुष्ट"     # Unverified  → label 2
        - "भ्रामक"     # Misleading  → label 1
        - "मिथ्या"     # False       → label 1
      labels_produced: [0, 1, 2]
      note: >
        Verdict appears as structured tag in article HTML.
        Raw date stored as Bikram Sambat string e.g. "भदौ ९, २०८३".
        BS to AD conversion happens in Stage 2 normalizer.

  # ---------------------------------------------------------------------------
  # SOURCE 2: NepalCheck.org (Nepali version)
  # Type:     Professional fact-checker
  # Active:   PARKED — inactive since Feb 2026, only 9 articles
  # ---------------------------------------------------------------------------
  nepalcheck:
    name: "nepalcheck"
    display_name: "NepalCheck (Nepali)"
    base_url: "https://np.nepalcheck.org/factcheck/"
    list_url_template: "https://np.nepalcheck.org/factcheck/page/{page}/"
    start_page: 1
    max_pages: null
    active: false              # PARKED — site inactive since Feb 2026
    rate_limit_seconds: 2
    retry_attempts: 3
    retry_backoff_seconds: 5
    language: "ne"
    scraper_class: "NepalcheckScraper"
    source_type: "fact_checker"
    cutoff_strategy: "url_date"
    # URL pattern: np.nepalcheck.org/YYYY/MM/DD/slug
    # Full date available in URL — reliable cutoff

    labels:
      raw:
        - "भ्रामक"    # Misleading → label 1
        - "मिथ्या"    # False      → label 1
        - "अपुष्ट"    # Unverified → label 2
        - "सही"       # True       → label 0
      labels_produced: [0, 1, 2]
      note: >
        Inactive since Feb 2026. Only 9 articles total.
        Parked — not in auto-pipeline.
        Raw date stored as-is from meta tag.

  # ---------------------------------------------------------------------------
  # SOURCE 3: NepalFactCheck.org
  # Type:     Non-profit fact-checker (CMR-Nepal + MySansar.com)
  # Founded:  April 2020
  # Active:   YES — publishing Aug 2026 (multiple per week)
  # Language: Nepali ONLY
  # ---------------------------------------------------------------------------
  nepalfactcheck:
    name: "nepalfactcheck"
    display_name: "Nepal Factcheck"
    base_url: "https://nepalfactcheck.org/"
    list_url_template: "https://nepalfactcheck.org/news/page/{page}/"
    start_page: 1
    max_pages: null
    active: true
    rate_limit_seconds: 2
    retry_attempts: 3
    retry_backoff_seconds: 5
    language: "ne"
    scraper_class: "NepalfactcheckScraper"
    source_type: "fact_checker"

    # Incremental cutoff strategy
    # URL pattern: nepalfactcheck.org/YYYY/MM/slug
    # Year + month available in URL — use as approximate cutoff
    cutoff_strategy: "url_date"

    labels:
      raw:
        - "सही सूचना"      # True        → label 0
        - "अपुष्ट सूचना"   # Unverified  → label 2
        - "भ्रामक सूचना"   # Misleading  → label 1
        - "मिथ्या सूचना"   # False       → label 1
      labels_produced: [0, 1, 2]
      note: >
        Explicitly publishes सही सूचना when factual claim
        has caused public confusion — confirmed in FAQ.
        Raw date stored as-is from meta tag ISO string.
        e.g. "2026-08-27T05:49:08+00:00" — truncation in Stage 2.

