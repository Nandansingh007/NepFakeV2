name: Tests

# Runs the offline test suite on every push and every pull request.
# No secrets are passed in, and pytest.ini blocks network access inside tests.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed by the git-history secret check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # same as the weekly scrape job
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -m "not slow" --cov=pipeline --cov=scrapers --cov=schema --cov-report=term-missing
