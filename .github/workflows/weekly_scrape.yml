# .github/workflows/daily_scrape.yml
# =============================================================================
# NepFakeV2 Daily Raw Data Collection
#
# Runs every day at 6AM NPT (00:15 UTC)
# Nepal timezone = UTC+5:45
#
# What it does:
#   1. Runs collector.py (incremental scrape)
#   2. Saves new raw articles to raw/
#   3. Updates last_run.json and stats_raw.json
#   4. Commits and pushes changes to main
#
# Manual trigger: Actions tab → Run workflow
# =============================================================================

name: Daily Raw Data Collection

on:
  schedule:
    - cron: '15 0 * * *'   # 6AM NPT daily (00:15 UTC)
  workflow_dispatch:         # allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        run: |
          python -m pipeline.collector

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet raw/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name "NepFakeV2 Bot"
          git config --global user.email "nandansingh007@gmail.com"
          git add raw/
          git commit -m "data: daily scrape $(date +'%Y-%m-%d') — $(python -c "import json; d=json.load(open('raw/stats_raw.json')); print(f\"{d['total_raw_articles']} total articles\")")"
          git push

      - name: No changes found
        if: steps.check_changes.outputs.changes != 'true'
        run: |
          echo "No new articles found today — skipping commit"