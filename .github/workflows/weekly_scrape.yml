name: NepFakeV2 Data Pipeline
on:
  schedule:
    - cron: '15 0 * * 1'  # weekly
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # full history, needed by the git-history secret check

      - name: Start FlareSolverr
        run: |
          docker run -d \
            --name flaresolverr \
            -p 8191:8191 \
            -e LOG_LEVEL=info \
            ghcr.io/flaresolverr/flaresolverr:latest
          sleep 15
          echo "FlareSolverr started"

      - name: Test FlareSolverr
        run: |
          curl -X POST http://localhost:8191/v1 \
            -H "Content-Type: application/json" \
            -d '{"cmd":"request.get","url":"https://techpana.com/factcheck/?tab=nepali&page=1","maxTimeout":60000}'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create logs directory
        run: mkdir -p logs

      # HF_TOKEN is deliberately NOT given to the collector any more.
      # Without it, collector.py skips its built-in Hugging Face push.
      # The push now happens in its own step below, only after the tests pass.
      - name: Run collector (scrape + normalize, no Hugging Face push)
        run: |
          python -m pipeline.collector

      # Gate: if any test fails, the job stops here. Nothing is committed
      # to GitHub and nothing is pushed to Hugging Face.
      - name: Run tests on the freshly scraped data
        run: |
          pytest -m "not slow"

      - name: Commit and push
        run: |
          git config --global user.name "NepFakeV2 Bot"
          git config --global user.email "nandan.singhs007@gmail.com"
          git add raw/ data/ README.md
          if git diff --staged --quiet; then
            echo "No new articles — skipping commit"
          else
            RAW=$(python -c "import json; d=json.load(open('raw/stats_raw.json')); print(d['total_raw_articles'])")
            NORM=$(python -c "import json; d=json.load(open('data/stats.json')); print(d['total_examples'])")
            git commit -m "data: scrape $(date +'%Y-%m-%d') — raw:${RAW} normalized:${NORM}"
            git push
          fi

      - name: Push dataset to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "import sys; from pipeline.hf_push import push_to_huggingface; sys.exit(0 if push_to_huggingface() else 1)"

      # If the tests failed, keep this week's scrape so it can be inspected
      # (it was not committed).
      - name: Upload rejected scrape for inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-scrape-${{ github.run_id }}
          path: |
            raw/
            data/
          retention-days: 30

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
          if-no-files-found: ignore