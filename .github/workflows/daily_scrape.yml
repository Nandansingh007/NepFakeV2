name: Daily Raw Data Collection

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        env:
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
        run: |
          python -m pipeline.collector

      - name: Commit and push raw data
        run: |
          git config --global user.name "NepFakeV2 Bot"
          git config --global user.email "nandansingh007@gmail.com"
          git add raw/
          if git diff --staged --quiet; then
            echo "No new articles — skipping commit"
          else
            TOTAL=$(python -c "import json; d=json.load(open('raw/stats_raw.json')); print(d['total_raw_articles'])")
            git commit -m "data: daily scrape $(date +'%Y-%m-%d') — ${TOTAL} total articles"
            git push
          fi

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30