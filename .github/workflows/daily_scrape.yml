name: Daily Raw Data Collection

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        run: |
          python -m pipeline.collector

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet raw/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name "NepFakeV2 Bot"
          git config --global user.email "nandansingh007@gmail.com"
          git add raw/
          TOTAL=$(python -c "import json; d=json.load(open('raw/stats_raw.json')); print(d['total_raw_articles'])")
          git commit -m "data: daily scrape $(date +'%Y-%m-%d') — ${TOTAL} total articles"
          git push

      - name: No changes found
        if: steps.check_changes.outputs.changes != 'true'
        run: |
          echo "No new articles found today — skipping commit"