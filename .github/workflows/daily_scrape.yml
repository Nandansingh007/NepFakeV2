name: Daily Raw Data Collection

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start FlareSolverr
        run: |
          docker run -d \
            --name flaresolverr \
            -p 8191:8191 \
            -e LOG_LEVEL=info \
            ghcr.io/flaresolverr/flaresolverr:latest
          sleep 15
          echo "FlareSolverr started"

      - name: Test FlareSolverr
        run: |
          curl -X POST http://localhost:8191/v1 \
            -H "Content-Type: application/json" \
            -d '{"cmd":"request.get","url":"https://techpana.com/factcheck/?tab=nepali&page=1","maxTimeout":60000}'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run collector
        run: |
          python -m pipeline.collector

      - name: Commit and push
        run: |
          git config --global user.name "NepFakeV2 Bot"
          git config --global user.email "nandansingh007@gmail.com"
          git add raw/ data/
          if git diff --staged --quiet; then
            echo "No new articles — skipping commit"
          else
            RAW=$(python -c "import json; d=json.load(open('raw/stats_raw.json')); print(d['total_raw_articles'])")
            NORM=$(python -c "import json; d=json.load(open('data/stats.json')); print(d['total_examples'])")
            git commit -m "data: daily scrape $(date +'%Y-%m-%d') — raw:${RAW} normalized:${NORM}"
            git push
          fi

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
          if-no-files-found: ignore